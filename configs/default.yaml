seed: 42

paths:
  processed_file: data/processed/train.pkl
  output_dir: outputs

data:
  target_col: control_success
  season_col: season
  row_id_col: row_id
  train_seasons: [2019, 2020, 2021, 2022]
  val_seasons: [2023]
  test_seasons: [2024]

  # Stage 1 history snapshot. target/ID는 사용하지 않는다.
  history_patterns:
    - "^asof_"

  exclude_columns:
    - pitcher_id
    - batter_id
    - pitcher_team_id
    - batter_team_id
    - control_success
    - row_id
    - season

stage1:
  context:
    latent_dim: 16
    hidden_dims: [128, 64]
    embedding_dim_max: 8
    dropout: 0.10
    category_mask_prob: 0.05
    numeric_noise_std: 0.03
    categorical_loss_weight: 1.0
    numeric_loss_weight: 1.0

  history:
    latent_dim: 16
    hidden_dims: [128, 64]
    dropout: 0.10
    noise_std: 0.03

  batch_size: 4096
  epochs: 30
  patience: 5
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 0
  latent_storage_dtype: float16

evaluation:
  batch_size: 8192
  sample_rows: 2000

# Latent-space kNN은 representation sanity probe로만 남겨둔다.
knn_probability:
  k_values: [20, 50, 100, 200, 500, 1000]
  index_type: ivf_flat
  nlist: 4096
  nprobe: 32
  index_train_rows: 200000
  query_batch_size: 4096
  use_gpu_if_available: true
  neighbor_example_queries: 5
  neighbor_example_k: 10

# 이전 local-probability 실험용 설정. 현재 train_stage2.py에서는 사용하지 않는다.
stage2_dataset:
  k_values: [100, 500, 1000]
  crossfit_folds: 5
  prior_strength: 50.0
  index_type: ivf_flat
  nlist: 4096
  nprobe: 32
  index_train_rows: 200000
  query_batch_size: 2048
  use_gpu_if_available: true

# Current Stage 2:
# frozen 16D context + 16D history = 32D latent
# z -> Linear(32,1) -> sigmoid -> P(control_success=1)
# raw 0/1 labels로 BCEWithLogitsLoss를 학습한다. kNN/보정/local prior는 사용하지 않는다.
stage2:
  batch_size: 8192
  eval_batch_size: 16384
  epochs: 30
  patience: 5
  min_delta: 0.000001
  learning_rate: 0.003
  weight_decay: 0.0
  threshold: 0.5
  num_workers: 0
