seed: 42

paths:
  processed_file: data/processed/train.pkl
  output_dir: outputs

data:
  target_col: control_success
  season_col: season
  row_id_col: row_id
  train_seasons: [2019, 2020, 2021, 2022]
  val_seasons: [2023]
  test_seasons: [2024]

  # Stage 1 history snapshot. target/ID는 사용하지 않는다.
  history_patterns:
    - "^asof_"

  exclude_columns:
    - pitcher_id
    - batter_id
    - pitcher_team_id
    - batter_team_id
    - control_success
    - row_id
    - season

# Stage 1 VAE.
# 기존 AE와 공정하게 비교하기 위해 feature 구성과 hidden/latent 차원은 유지한다.
# context/history 각각 q(z|x)=N(mu, sigma^2)를 학습하고,
# Stage2에는 random sample이 아니라 deterministic posterior mean mu를 전달한다.
stage1:
  context:
    latent_dim: 16
    hidden_dims: [128, 64]
    embedding_dim_max: 8
    dropout: 0.10
    category_mask_prob: 0.05
    numeric_noise_std: 0.03
    categorical_loss_weight: 1.0
    numeric_loss_weight: 1.0
    kl_beta: 0.0005
    kl_warmup_epochs: 10

  history:
    latent_dim: 16
    hidden_dims: [128, 64]
    dropout: 0.10
    noise_std: 0.03
    kl_beta: 0.0005
    kl_warmup_epochs: 10

  batch_size: 4096
  epochs: 30
  patience: 5
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 0
  latent_storage_dtype: float16

evaluation:
  batch_size: 8192
  sample_rows: 2000

# Latent-space kNN은 representation sanity probe로만 남겨둔다.
knn_probability:
  k_values: [20, 50, 100, 200, 500, 1000]
  index_type: ivf_flat
  nlist: 4096
  nprobe: 32
  index_train_rows: 200000
  query_batch_size: 4096
  use_gpu_if_available: true
  neighbor_example_queries: 5
  neighbor_example_k: 10

# 이전 local-probability 실험용 설정. 현재 train_stage2.py에서는 사용하지 않는다.
stage2_dataset:
  k_values: [100, 500, 1000]
  crossfit_folds: 5
  prior_strength: 50.0
  index_type: ivf_flat
  nlist: 4096
  nprobe: 32
  index_train_rows: 200000
  query_batch_size: 2048
  use_gpu_if_available: true

# Current Stage 2 experiment:
# frozen VAE posterior means: 16D context mu + 16D history mu = 32D
# 32 -> 64 -> GELU -> 32 -> GELU -> 1 -> sigmoid
# raw 0/1 labels로 BCEWithLogitsLoss를 학습한다.
# Linear baseline은 src/stage2_linear.py에 보존한다.
stage2:
  hidden_dims: [64, 32]
  batch_size: 8192
  eval_batch_size: 16384
  epochs: 30
  patience: 5
  min_delta: 0.000001
  learning_rate: 0.003
  weight_decay: 0.0
  threshold: 0.5
  num_workers: 0
