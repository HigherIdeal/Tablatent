seed: 42

paths:
  processed_file: data/processed/train.pkl
  output_dir: outputs

data:
  target_col: control_success
  season_col: season
  row_id_col: row_id
  train_seasons: [2019, 2020, 2021, 2022]
  val_seasons: [2023]
  test_seasons: [2024]

  # Stage 1 history snapshot. target/ID는 사용하지 않는다.
  history_patterns:
    - "^asof_"

  exclude_columns:
    - pitcher_id
    - batter_id
    - pitcher_team_id
    - batter_team_id
    - control_success
    - row_id
    - season

stage1:
  context:
    latent_dim: 16
    hidden_dims: [128, 64]
    embedding_dim_max: 8
    dropout: 0.10
    category_mask_prob: 0.05
    numeric_noise_std: 0.03
    categorical_loss_weight: 1.0
    numeric_loss_weight: 1.0

  history:
    latent_dim: 16
    hidden_dims: [128, 64]
    dropout: 0.10
    noise_std: 0.03

  batch_size: 4096
  epochs: 30
  patience: 5
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 0
  latent_storage_dtype: float16

evaluation:
  batch_size: 8192
  sample_rows: 2000

# Stage 2 첫 baseline: frozen Stage 1 latent에서 가까운 과거 row들의
# control_success 평균을 확률로 사용한다.
knn_probability:
  k_values: [20, 50, 100, 200, 500, 1000]
  index_type: ivf_flat
  nlist: 4096
  nprobe: 32
  index_train_rows: 200000
  query_batch_size: 4096
  use_gpu_if_available: true
  neighbor_example_queries: 5
  neighbor_example_k: 10
