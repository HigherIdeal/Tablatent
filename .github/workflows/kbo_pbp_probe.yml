name: KBO PBP Probe

on:
  push:
    branches:
      - agent/kbo-pbp-probe

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe Naver Sports historical KBO relay API
        shell: bash
        run: |
          mkdir -p outputs/kbo_pbp_probe
          python - <<'PY'
          import json
          import pathlib
          import urllib.parse
          import urllib.request
          import time

          OUT = pathlib.Path('outputs/kbo_pbp_probe')
          OUT.mkdir(parents=True, exist_ok=True)
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'
          dates = {
              2019: '2019-03-23',
              2020: '2020-05-05',
              2021: '2021-04-03',
              2022: '2022-04-02',
              2023: '2023-04-01',
              2024: '2024-03-23',
          }

          def get_json(url):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'application/json'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read()
                  return r.status, json.loads(body.decode('utf-8'))

          summary = []
          for year, date in dates.items():
              q = urllib.parse.urlencode({
                  'upperCategoryId': 'kbaseball',
                  'fromDate': date,
                  'toDate': date,
              })
              schedule_url = f'https://api-gw.sports.naver.com/schedule/games?{q}'
              row = {'year': year, 'date': date, 'schedule_url': schedule_url}
              try:
                  status, sched = get_json(schedule_url)
                  row['schedule_http'] = status
                  (OUT / f'{year}_schedule.json').write_text(json.dumps(sched, ensure_ascii=False, indent=2), encoding='utf-8')
                  games = ((sched.get('result') or {}).get('games') or []) if isinstance(sched, dict) else []
                  kbo_games = [g for g in games if g.get('categoryId') == 'kbo'] or games
                  row['n_games'] = len(kbo_games)
                  if not kbo_games:
                      row['relay_ok'] = False
                      row['error'] = 'no games returned'
                      summary.append(row)
                      continue
                  game = kbo_games[0]
                  game_id = game.get('gameId') or game.get('gamePk') or game.get('id')
                  row['game_id'] = game_id
                  row['home'] = game.get('homeTeamName')
                  row['away'] = game.get('awayTeamName')
                  if not game_id:
                      row['relay_ok'] = False
                      row['error'] = f'game id not found; keys={sorted(game.keys())}'
                      summary.append(row)
                      continue
                  relay_url = f'https://api-gw.sports.naver.com/schedule/games/{game_id}/relay'
                  row['relay_url'] = relay_url
                  rstatus, relay = get_json(relay_url)
                  row['relay_http'] = rstatus
                  (OUT / f'{year}_{game_id}_relay.json').write_text(json.dumps(relay, ensure_ascii=False, indent=2), encoding='utf-8')
                  trd = ((relay.get('result') or {}).get('textRelayData')) if isinstance(relay, dict) else None
                  row['relay_ok'] = trd is not None
                  if isinstance(trd, dict):
                      trs = trd.get('textRelays') or []
                      row['n_text_relays'] = len(trs)
                      row['relay_keys'] = sorted(trd.keys())
                      if trs:
                          row['first_text_relay_keys'] = sorted(trs[0].keys())
                          opts = trs[0].get('textOptions') or []
                          row['first_text_options'] = opts[:5]
                  summary.append(row)
              except Exception as e:
                  row['relay_ok'] = False
                  row['error'] = repr(e)
                  summary.append(row)
              time.sleep(0.4)

          (OUT / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kbo-pbp-probe
          path: outputs/kbo_pbp_probe
          if-no-files-found: error
